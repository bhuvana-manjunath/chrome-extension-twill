<style>
  iframe {
    border-width: 0px;
    border-style: inset;
    border-color: initial;
    border-image: initial;
  }
  .spinner {
  top: 100px;
  width: 40px;
  height: 40px;
  position: relative;
  margin: 0 auto;
}

.spinner:before {
  content: '';
  box-sizing: border-box;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid #ccc;
  border-top-color: #333;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  0% {
    transform: rotate(0);
  }
  100% {
    transform: rotate(360deg);
  }
}

</style>
